<main class="auth-page">
  <section class="auth-card" aria-labelledby="login-title">
    <a class="auth-brand" routerLink="/">Flow<span>Trim</span></a>
    <p class="auth-kicker">{{ 'auth.kicker' | translate }}</p>
    <h1 id="login-title">{{ 'auth.loginTitle' | translate }}</h1>
    <p class="auth-copy">{{ 'auth.loginText' | translate }}</p>
    <button class="auth-primary" type="button" (click)="startLogin()">
      {{ 'auth.continue' | translate }}
    </button>
    @if (error(); as message) {
      <p class="auth-error" role="alert">{{ message }}</p>
    }
    <a class="auth-back" routerLink="/">{{ 'common.back' | translate }}</a>
  </section>
</main>
