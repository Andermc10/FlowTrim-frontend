<div class="app-shell">
  <aside class="workspace-rail" aria-label="Workspace navigation">
    <a class="brand" routerLink="/app" aria-label="FlowTrim workspace overview">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" role="img">
          <path d="M7 8.5h10.5c4.7 0 7.5 2.3 7.5 6.2 0 3.8-2.8 6.1-7.5 6.1H12" />
          <path d="M7 23.5h7.2M12 20.8l4.5 4.5M12 20.8l4.5-4.5" />
        </svg>
      </span>
      <span class="brand__name">Flow<span>Trim</span></span>
    </a>

    <div class="rail-label">Control workspace</div>

    <nav class="rail-nav">
      <a routerLink="/app" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
        <span class="nav-icon" aria-hidden="true">⌂</span>
        <span>Overview</span>
      </a>
      <a routerLink="/app/subscriptions" routerLinkActive="is-active">
        <span class="nav-icon" aria-hidden="true">◫</span>
        <span>Subscriptions</span>
      </a>
      <a routerLink="/app/upcoming" routerLinkActive="is-active">
        <span class="nav-icon" aria-hidden="true">↗</span>
        <span>Upcoming</span>
      </a>
      <a routerLink="/app/simulator" routerLinkActive="is-active">
        <span class="nav-icon" aria-hidden="true">✂</span>
        <span>Simulator</span>
      </a>
    </nav>

    <div class="rail-spacer"></div>

    <div class="workspace-status">
      <span class="status-dot" aria-hidden="true"></span>
      <div>
        <strong>Local workspace</strong>
        <span>API connected</span>
      </div>
    </div>

    <button class="theme-toggle" type="button" (click)="toggleTheme()" [attr.aria-label]="themeLabel()">
      <span aria-hidden="true">{{ themeIcon() }}</span>
      <span>{{ themeMode() }} mode</span>
    </button>

    <a class="rail-cta" routerLink="/app/subscriptions/new">
      <span aria-hidden="true">+</span>
      <span>Add subscription</span>
    </a>
  </aside>

  <div class="workspace-content">
    <header class="mobile-header">
      <a class="brand brand--compact" routerLink="/app" aria-label="FlowTrim workspace overview">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M7 8.5h10.5c4.7 0 7.5 2.3 7.5 6.2 0 3.8-2.8 6.1-7.5 6.1H12" /><path d="M7 23.5h7.2M12 20.8l4.5 4.5M12 20.8l4.5-4.5" /></svg>
        </span>
        <span class="brand__name">Flow<span>Trim</span></span>
      </a>
      <button class="mobile-theme-toggle" type="button" (click)="toggleTheme()" [attr.aria-label]="themeLabel()">
        {{ themeIcon() }}
      </button>
    </header>

    <main class="workspace-main">
      <div class="workspace-eyebrow">FLOWTRIM / PERSONAL FINANCE CONTROL</div>
      <router-outlet />
    </main>

    <nav class="mobile-nav" aria-label="Mobile workspace navigation">
      <a routerLink="/app" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">
        <span aria-hidden="true">⌂</span><small>Overview</small>
      </a>
      <a routerLink="/app/subscriptions" routerLinkActive="is-active">
        <span aria-hidden="true">◫</span><small>Subscriptions</small>
      </a>
      <a routerLink="/app/upcoming" routerLinkActive="is-active">
        <span aria-hidden="true">↗</span><small>Upcoming</small>
      </a>
      <a routerLink="/app/simulator" routerLinkActive="is-active">
        <span aria-hidden="true">✂</span><small>Simulator</small>
      </a>
    </nav>
  </div>
</div>
